apiVersion: v1
kind: Secret
metadata:
  name: colonies-server
type: Opaque
stringData:
  COLONIES_SERVER_PRVKEY: {{ required "serverPrvKey is required" .Values.serverPrvKey | quote }}
  COLONIES_SERVER_ID: {{ required "serverId is required" .Values.serverId | quote }}
  COLONIES_DB_PASSWORD: {{ required "dbPassword is required" .Values.dbPassword | quote }}
  POSTGRES_PASSWORD: {{ .Values.dbPassword | quote }}
